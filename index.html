            var isCurrent = (r.name === currentRank.name);
            var isUnlocked = (userProfile.xp >= r.xp);
            var borderColor = isCurrent ? '#f5b042' : (isUnlocked ? '#f5b04240' : '#1e2556');
            html += '<div style="background:#0f2c44;border-radius:16px;padding:18px;text-align:center;border:2px solid ' + borderColor + '; transition:0.2s;">';
            html += '<i class="fas ' + r.icon + '" style="color:' + (isUnlocked ? '#f5b042' : '#4a5580') + ';font-size:32px;margin-bottom:8px;display:block;"></i>';
            html += '<div style="font-size:20px; font-weight:700; color:' + (isUnlocked ? '#f5b042' : '#6b7280') + ';">' + r.name + '</div>';
            html += '<div style="font-size:14px; color:#d1d5db; margin-top:4px;">' + r.desc + '</div>';
            html += '<div style="font-size:16px; font-weight:600; color:#ffffff; margin-top:6px;">' + r.xp + ' XP</div>';
            if (isCurrent) {
                html += '<div style="margin-top:8px;background:#f5b042;color:#0a0f2c;padding:4px 14px;border-radius:999px;font-size:13px;font-weight:700;display:inline-block;">Mevcut Seviye</div>';
            } else if (!isUnlocked) {
                html += '<div style="margin-top:8px;color:#6b7280;font-size:13px;">🔒 Kilitli</div>';
            } else {
                html += '<div style="margin-top:8px;color:#34d399;font-size:13px;font-weight:600;">✅ Açık</div>';
            }
            html += '</div>';
        }
        html += '</div>';
        html += '<div style="margin-top:20px;background:#0f1338;padding:20px;border-radius:12px;border:1px solid #1e2556;">';
        html += '<p style="color:#f5b042;font-size:18px;font-weight:600;">📊 İlerleme Durumu</p>';
        html += '<p style="color:white;font-size:16px;">Mevcut Seviye: <strong style="color:#f5b042;font-size:20px;">' + currentRank.name + '</strong></p>';
        var nextRank = getNextRank();
        if (nextRank) {
            var progress = getProgressToNext();
            html += '<p style="color:#d1d5db;font-size:15px;">Sonraki Seviye: ' + nextRank.name + ' (' + nextRank.xp + ' XP)</p>';
            html += '<div class="progress-bar" style="margin-top:8px;"><div class="progress-fill" style="width:' + progress + '%;"></div></div>';
            html += '<p style="color:#9ca3af;font-size:13px;margin-top:4px;">%' + Math.round(progress) + ' tamamlandı</p>';
        } else {
            html += '<p style="color:#34d399;font-size:18px;font-weight:700;">🏆 En yüksek seviyedesiniz!</p>';
        }
        html += '</div></div>';
        return html;
    }
